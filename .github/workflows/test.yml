name: Test

on:
  workflow_dispatch:
  push:
    branches:
      - oldstable
      - stable
      - testing
      - unstable
      - smart
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/test.yml'
  pull_request:
    branches:
      - oldstable
      - stable
      - testing
      - unstable
      - smart

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ inputs.build }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        go:
          - ~1.25
          - ~1.26
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Set build tags and ldflags
        shell: bash
        run: |
          # The admin panel embeds a frontend build that this workflow does not produce.
          echo "BUILD_TAGS=$(sed 's/,with_admin_panel//' release/DEFAULT_BUILD_TAGS_OTHERS)" >> "$GITHUB_ENV"
          echo "LDFLAGS_SHARED=$(cat release/LDFLAGS)" >> "$GITHUB_ENV"
          # The harness has its own race step below.
          echo "TEST_PACKAGES=$(go list ./... | grep -v /smartharness | tr '\n' ' ')" >> "$GITHUB_ENV"
          # Upstream sudoku test, flaky on every runner OS.
          echo "TEST_SKIP=^TestSession_LargeTransferBackpressure$" >> "$GITHUB_ENV"
      - name: Test (unix)
        if: matrix.os != 'windows-latest'
        run: go test -v -exec sudo -tags "$BUILD_TAGS" -ldflags "$LDFLAGS_SHARED" -skip "$TEST_SKIP" $TEST_PACKAGES
      - name: Test (windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: go test -v -tags "$BUILD_TAGS" -ldflags "$LDFLAGS_SHARED" -skip "$TEST_SKIP" $TEST_PACKAGES
      - name: Smart unit tests (race)
        if: matrix.os == 'ubuntu-latest' && matrix.go == '~1.26'
        env:
          GOTOOLCHAIN: go1.26.8
        run: go test -race -count=1 -ldflags=-checklinkname=0 -tags with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api,with_tailscale,with_ccm,with_ocm,badlinkname,tfogo_checklinkname0 ./protocol/group/ ./transport/wireguard/
      # Two-core runners cannot carry the throughput scenarios under -race; local acceptance runs them with it.
      - name: Smart real-component harness
        if: matrix.os == 'ubuntu-latest' && matrix.go == '~1.26'
        env:
          GOTOOLCHAIN: go1.26.8
        run: go test -count=1 -timeout=15m -ldflags=-checklinkname=0 -tags with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api,with_tailscale,with_ccm,with_ocm,badlinkname,tfogo_checklinkname0 ./protocol/group/smartharness/
